name: CI Java - Teste de Software

# push so na master + qualquer pull request (evita execucao duplicada em branch com PR aberto)
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # menor privilegio: o CI so precisa ler o codigo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'  # deve ser compativel com o pom.xml
          cache: maven        # cache das dependencias do Maven (experimento de eficiencia)
      # testes + relatorio de cobertura do JaCoCo (o plugin ja esta no pom.xml)
      - run: mvn -B test jacoco:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-jacoco
          path: target/site/jacoco
